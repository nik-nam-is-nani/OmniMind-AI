<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }
        .game-container {
            text-align: center;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            margin: 20px auto;
        }
        .cell {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #ccc;
            border-radius: 5px;
            background-color: #eee;
            transition: background-color 0.3s ease;
        }
        .cell:hover {
            background-color: #ddd;
        }
        .cell.X {
            color: #007bff; /* Blue for X */
        }
        .cell.O {
            color: #dc3545; /* Red for O */
        }
        .message {
            font-size: 1.5em;
            color: #555;
            margin-top: 20px;
            min-height: 40px; /* To prevent layout shifts */
        }
        button {
            padding: 15px 30px;
            font-size: 1.2em;
            color: #fff;
            background-color: #28a745;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 25px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Tic-Tac-Toe</h1>
        <div class="board" id="gameBoard">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <div class="message" id="gameMessage">Player X's turn</div>
        <button id="resetButton">Play Again</button>
    </div>

    <script>
        const board = document.getElementById('gameBoard');
        const messageElement = document.getElementById('gameMessage');
        const resetButton = document.getElementById('resetButton');
        const cells = document.querySelectorAll('.cell');

        let currentPlayer = 'X';
        let gameActive = true;
        let gameState = ["", "", "", "", "", "", "", "", ""]; // Represents the 3x3 board state

        const winningConditions = [
            [0, 1, 2], // Top row
            [3, 4, 5], // Middle row
            [6, 7, 8], // Bottom row
            [0, 3, 6], // Left column
            [1, 4, 7], // Middle column
            [2, 5, 8], // Right column
            [0, 4, 8], // Diagonal from top-left
            [2, 4, 6]  // Diagonal from top-right
        ];

        // Function to handle a cell click
        function handleCellClick(event) {
            const clickedCell = event.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            // If the cell is already filled or the game is not active, do nothing
            if (gameState[clickedCellIndex] !== "" || !gameActive) {
                return;
            }

            // Update game state and UI
            gameState[clickedCellIndex] = currentPlayer;
            clickedCell.textContent = currentPlayer;
            clickedCell.classList.add(currentPlayer);

            // Check for win or tie
            checkResult();
        }

        // Function to check if there's a win or tie
        function checkResult() {
            let roundWon = false;
            for (let i = 0; i < winningConditions.length; i++) {
                const winCondition = winningConditions[i];
                let a = gameState[winCondition[0]];
                let b = gameState[winCondition[1]];
                let c = gameState[winCondition[2]];

                if (a === "" || b === "" || c === "") {
                    continue; // Skip if any cell in the condition is empty
                }
                if (a === b && b === c) {
                    roundWon = true;
                    break; // Found a winner
                }
            }

            if (roundWon) {
                messageElement.textContent = `Player ${currentPlayer} has won!`;
                gameActive = false; // End the game
                return;
            }

            // Check for tie (if no winner and all cells are filled)
            const roundDraw = !gameState.includes("");
            if (roundDraw) {
                messageElement.textContent = "It's a draw!";
                gameActive = false; // End the game
                return;
            }

            // If no win or draw, switch player
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            messageElement.textContent = `Player ${currentPlayer}'s turn`;
        }

        // Function to reset the game
        function resetGame() {
            gameActive = true;
            currentPlayer = 'X';
            gameState = ["", "", "", "", "", "", "", "", ""]; // Reset board state
            messageElement.textContent = "Player X's turn"; // Reset message

            // Clear the UI
            cells.forEach(cell => {
                cell.textContent = "";
                cell.classList.remove('X', 'O');
            });
        }

        // Add event listeners
        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });
        resetButton.addEventListener('click', resetGame);

    </script>
</body>
</html>
